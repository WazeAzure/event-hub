baseURL: ''
title: Women In Tech Security
languageCode: en-us
DefaultContentLanguage: en
enableEmoji: true
enableGitInfo: true
enableRobotsTXT: true
canonifyURLs: true
paginate: 9
darkmode_js:
  - assets/js/darkmode.js
enableInlineShortcodes: true

markup:
  goldmark:
    extensions:
      definitionList: true
      footnote: true
      linkify: true
      linkifyProtocol: https
      strikethrough: true
      table: true
      taskList: true
      typographer:
        apostrophe: '&rsquo;'
        disable: false
        ellipsis: '&hellip;'
        emDash: '&mdash;'
        enDash: '&ndash;'
        leftAngleQuote: '&laquo;'
        leftDoubleQuote: '&ldquo;'
        leftSingleQuote: '&lsquo;'
        rightAngleQuote: '&raquo;'
        rightDoubleQuote: '&rdquo;'
        rightSingleQuote: '&rsquo;'
    parser:
      attribute:
        block: false
        title: true
      autoHeadingID: true
      autoHeadingIDType: github
      wrapStandAloneImageWithinParagraph: true
    renderer:
      hardWraps: false
      unsafe: true
      xhtml: false

params:
  author: Nusser Studios
  authorimage: ../assets/images/global/author.webp
  og_image: /images/tailbliss-cover.png
  heroTitle: "Security For Everyone"
  moto: "Wo-Men In Tech Security"
  # moto2: "Women in Tech Security"
  description: "Women In Tech Security - Empowering women and raising cybersecurity awareness for everyone."
  disable_theme_toggle: false
  disable_stay_uptodate: false

  p1:
    heading: "Our vision and mission"
    image: "images/pages/our-mission.png"
    content:
      - text: "Our Vision: A diverse and inclusive world where everyone is fully aware of and actively takes care of their cybersecurity."
      - text: "Our Mission: At Women in Tech Security, our mission is to create a secure, inclusive digital landscape by fostering cybersecurity awareness and empowering individuals, especially women, to thrive in the cybersecurity field. We strive to:"
      - lists: 
        - "Educating the public on emerging threats and protection strategies to ensure safer online spaces."
        - "Providing resources, opportunities, and networks for women to advance their careers in cybersecurity."
        - "Cultivating a strong, supportive community where knowledge and experiences are shared freely."
        - "Fostering an inclusive environment where everyone can contribute to securing the digital world."
  p2:
    heading: "Lorem Ipsum Dolor sit."
    image: "images/pages/hacktoberfest.jpg"
    content:
      - text: "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Curabitur at purus non enim commodo tincidunt vel in nulla. Aenean pretium dolor non ultricies bibendum. Etiam quis blandit enim. Nunc condimentum ut lorem in faucibus. Phasellus varius ligula et commodo tristique. Nunc sodales nisl nec laoreet vehicula. Donec velit nibh, sollicitudin at nulla a, egestas dignissim eros. Sed lacinia hendrerit interdum. Vestibulum pellentesque sem venenatis nisl tempor accumsan sit amet tempus felis. Mauris leo diam, porttitor nec bibendum id, tempus ac nulla. Etiam congue ornare erat at convallis. Donec in nisi dapibus, mattis risus vel, imperdiet enim. Donec fermentum sit amet tortor nec tincidunt. Nam nec lectus tortor. Nunc sit amet laoreet orci, porta ornare massa. Phasellus eget lorem mi. Nam eleifend ultricies sapien, quis mollis leo bibendum at. Quisque viverra lorem sit amet magna aliquet, et dignissim arcu eleifend."
  p3:
    heading: "Backed by renowned Security Specialist"
    content:
      - text: "Sagittis scelerisque nulla cursus in enim consectetur quam. Dictum urna sed consectetur neque tristique pellentesque. Blandit amet, sed aenean erat arcu morbi. Cursus faucibus nunc nisl netus morbi vel porttitor vitae ut. Amet vitae fames senectus vitae."
    links:
      - text: Meet our director and advisors
        url: "#"
    logos:
      - identifier: a
        image: "images/global/sample-logo.svg"
        alt: "a"
      - identifier: b
      - identifier: c
      - identifier: d
      - identifier: e
      - identifier: f
  p4:
    heading: "From the blog"
    content:
      - text: "Lorem ipsum dolor sit amet consectetur, adipisicing elit. Ipsa libero labore natus atque, ducimus sed."
  p5:
    heading: "Stay Up to Date"
    content:
      - text: "Sagittis scelerisque nulla cursus in enim consectetur quam. Dictum urna sed consectetur neque tristique pellentesque."
    action: "#"
    label: "Email address"
    placeholder: "Enter your email"
    button: "Notify me"
  p6:
    heading: "What is WTS?"
    content:
      - text: "Women In Tech Security (WTS) is an initiative aimed at building cybersecurity awareness and increasing community involvement, especially among women. We welcome everyone regardless of gender or background."

  p7:
    heading: "Area of Topics"
    content:
      - text: "We cover a wide range of cybersecurity-related areas, including:"
    lists:
      - "Cyber Insecurity: Risks like malware, hacking, phishing, scams, fraud, and disinformation."
      - "Data Privacy, Protection, and Security: Ensuring confidentiality, integrity, and availability of information."
      - "Open Source Intelligence: Gathering public info to detect scams, fraud, or threat actors."
      - "Cybersecurity Career: Career paths including security analysts, ethical hackers, and consultants."

  p8:
    heading: "How Can WTS Help You Get Involved?"
    content:
      - text: "Our organization provides different ways to engage and grow in cybersecurity:"
    lists:
      - "Content & Storytelling"
      - "Community & Networking"
      - "Events & Collaboration"
      - "Leadership & Empowerment"
    footer: "We engage members with insightful content, foster strong networks, facilitate impactful events, and cultivate leadership opportunities."

  social_media:
    github:
      enabled: true
      url: 'https://github.com/nusserstudios'
    facebook:
      enabled: true
      url: 'https://facebook.com/nusserstudios'
    instagram:
      enabled: true
      url: 'https://instagram.com/nusserstudios'
    twitter:
      enabled: true
      url: 'https://twitter.com/nusserstudios'
    

