{{ define "main" }}
<section class="bg-black text-white py-16 px-6 md:px-12">
  <div class="max-w-3xl mx-auto">
    <h1 class="text-4xl font-bold mb-6 text-purple-400">{{ .Title }}</h1>
        {{ if .Date }}
          {{ if ne (.Date.Format "2006") "0001" }}
            <p class="text-sm text-gray-400 mb-2">{{ .Date | time.Format "Jan 2, 2006" }}</p>
          {{ end }}
        {{ end }}    <div class="prose prose-invert max-w-none">
      {{ .Content }}
    </div>
  </div>
</section>
{{ end }}
